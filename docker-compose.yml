services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: zcashorg
      POSTGRES_PASSWORD: zcashorg
      POSTGRES_DB: zcashorg
    ports:
      - "5432:5432"
    volumes:
      - zcashorg_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zcashorg"]
      interval: 5s
      timeout: 5s
      retries: 5

  coordinator:
    build:
      context: .
      dockerfile: services/coordinator/Dockerfile
    environment:
      DATABASE_URL: postgres://zcashorg:zcashorg@postgres:5432/zcashorg
      PORT: "8787"
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy

  indexer:
    build:
      context: .
      dockerfile: services/indexer/Dockerfile
    environment:
      INDEXER_PORT: "8788"
    ports:
      - "8788:8788"

volumes:
  zcashorg_pg:
